<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <title>unfinished.</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=PT+Sans&display=swap" rel="stylesheet">

    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            background: #000;
            overflow: hidden;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100dvh;
        }

        #game {
            position: relative;
            width: 100%;
            height: 100%;
            height: 100dvh;
            background: #000;
            overflow: hidden;
        }

        #warning {
            color: #fff;
            font-family: "PT Sans", sans-serif;
            font-size: 10px;
            line-height: 1.3;
            text-align: center;
            opacity: 0;
            transition: opacity 0.2s ease;
            max-width: 360px;
            width: 70%;
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            z-index: 2;
        }

        #scene {
            position: absolute;
            width: 100%;
            aspect-ratio: 16 / 10;
            max-height: 100%;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            background: #fff;
            opacity: 0;
            transition: opacity 1.2s ease;
            overflow: hidden;
        }

        #grid {
            position: absolute;
            width: 220%;
            height: 220%;
            left: 50%;
            top: 50%;
            display: grid;
            grid-template-columns: repeat(100, 20px);
            grid-template-rows: repeat(100, 20px);
            transform: translate(-50%, -50%) rotate(-25deg);
            opacity: 0;
        }

        #grid.show {
            animation:
                fadeGrid 1.5s ease forwards,
                scrollGrid 5s linear infinite;
        }

        .tile {
            width: 20px;
            height: 20px;
        }

        .blue {
            background: #6bb7f0;
        }

        .white {
            background: #fff;
        }

        #topAccent {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 55px;
            background: linear-gradient(
                to bottom,
                rgba(120, 155, 225, 0.22) 0%,
                rgba(145, 145, 225, 0.13) 25%,
                rgba(180, 170, 230, 0.06) 55%,
                rgba(255, 255, 255, 0) 100%
            );
            z-index: 3;
            pointer-events: none;
            opacity: 0;
        }

        #bottomAccent {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 60px;
            background: linear-gradient(
                to top,
                rgba(205, 195, 225, 0.20) 0%,
                rgba(220, 210, 230, 0.12) 25%,
                rgba(238, 230, 242, 0.05) 55%,
                rgba(255, 255, 255, 0) 100%
            );
            z-index: 3;
            pointer-events: none;
            opacity: 0;
        }

        #grid.show ~ #topAccent,
        #grid.show ~ #bottomAccent {
            animation: fadeAccents 1.5s ease forwards;
        }

        .button {
            font-family: "PT Sans", sans-serif;
            font-size: 15px;
            padding: 7px 14px;
            border: none;
            border-radius: 7px;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.92);
            color: #333;
            box-shadow: 0 2px 8px rgba(80, 70, 120, 0.15);
        }

        @keyframes fadeGrid {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        @keyframes fadeAccents {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        @keyframes scrollGrid {
            from {
                transform: translate(-50%, -50%) rotate(-25deg);
            }

            to {
                transform: translate(
                    calc(-50% + 40px),
                    calc(-50% - 40px)
                ) rotate(-25deg);
            }
        }

        @media (orientation: landscape) and (min-aspect-ratio: 16/10) {
            #scene {
                width: 160dvh;
                height: 100dvh;
            }
        }
    </style>
</head>

<body>
    <div id="game">
        <div id="warning">
            Warning: This game contains mature themes and may not be suitable for children or sensitive players.
        </div>

        <div id="scene">
            <div id="grid"></div>

            <div id="topAccent"></div>
            <div id="bottomAccent"></div>
        </div>
    </div>

    <script>
        const warning = document.getElementById("warning");
        const scene = document.getElementById("scene");
        const grid = document.getElementById("grid");

        for (let row = 0; row < 100; row++) {
            for (let column = 0; column < 100; column++) {
                const tile = document.createElement("div");

                tile.className =
                    "tile " +
                    ((row + column) % 2 === 0 ? "blue" : "white");

                grid.appendChild(tile);
            }
        }

        setTimeout(() => {
            warning.style.opacity = "1";

            setTimeout(() => {
                warning.style.transition = "opacity 1.5s ease";
                warning.style.opacity = "0";

                setTimeout(() => {
                    scene.style.opacity = "1";

                    setTimeout(() => {
                        grid.classList.add("show");
                    }, 800);
                }, 1500);
            }, 2700);
        }, 3000);
    </script>
</body>
</html>
