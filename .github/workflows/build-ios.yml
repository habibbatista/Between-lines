name: Build iOS app (unsigned IPA)

# Runs by hand (Actions tab -> Run workflow) and every time index.html changes.
# Needs only index.html in the repo root. Everything else is generated here.

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - index.html
      - .github/workflows/build-ios.yml

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Use the newest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Create the Capacitor iOS project around index.html
        run: |
          mkdir www
          cp index.html www/index.html
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/ios
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.forevertogether.game",
            "appName": "Forever Together",
            "webDir": "www",
            "backgroundColor": "#000000",
            "ios": {
              "backgroundColor": "#000000",
              "contentInset": "never"
            }
          }
          EOF
          npx cap add ios
          npx cap sync ios

      - name: Landscape only and hide the status bar
        run: |
          PLIST=ios/App/App/Info.plist
          for KEY in "UISupportedInterfaceOrientations" "UISupportedInterfaceOrientations~ipad"; do
            /usr/libexec/PlistBuddy -c "Delete :$KEY" "$PLIST" || true
            /usr/libexec/PlistBuddy -c "Add :$KEY array" "$PLIST"
            /usr/libexec/PlistBuddy -c "Add :$KEY:0 string UIInterfaceOrientationLandscapeLeft" "$PLIST"
            /usr/libexec/PlistBuddy -c "Add :$KEY:1 string UIInterfaceOrientationLandscapeRight" "$PLIST"
          done
          /usr/libexec/PlistBuddy -c "Delete :UIStatusBarHidden" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :UIStatusBarHidden bool true" "$PLIST"
          /usr/libexec/PlistBuddy -c "Delete :UIViewControllerBasedStatusBarAppearance" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :UIViewControllerBasedStatusBarAppearance bool false" "$PLIST"

      - name: Build without signing (your sideload tool signs it)
        run: |
          cd ios/App
          if [ -d App.xcworkspace ]; then
            TARGET=(-workspace App.xcworkspace)
          else
            TARGET=(-project App.xcodeproj)
          fi
          xcodebuild "${TARGET[@]}" -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath ../../build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Package the IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qr ForeverTogether.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: ForeverTogether-ipa
          path: ForeverTogether.ipa
